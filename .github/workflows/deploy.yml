name: Deploy to Cloudflare Workers
run-name: CFSM encrypted recovery point before CPU repair
on:
  push:
    branches: [maintenance/cpu-recovery-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'chore: run authorized encrypted backup once'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare public encryption key
        shell: bash
        run: |
          cat > backup-public-key.pem <<'PUBLIC_KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAq3WsoeUNs7DfTV94lIyD
          FYmqU0Y+uUcweqFCkj53VHcM+vaQeP8zpL/dH3w17NqM6X50UAssP+TuZDFWdl24
          4dDV0solBec/n5cHx/s4Zt01FXV2ef90Vgh67n4xwW1fI14xMzI5Lx3DjQTP2vZz
          Sczpsap6hZHyp2Fp1+Wa+Awz4yLvvSYyVvjC+hPj9TecXG31q3LWz4Epuoyh1kcl
          YUg9nRNEsi2r9iEnllK69RWVXBeNkNp739C4Vj5soYMun4n6Wo1yBM6GR0anUVm3
          qAou1Qeliwrwm0X8xQqbAc4apstK+kQJ5MtrSo6vwpazBjntPLpCvlTpLgzu8hd9
          PB7U7+aaZx1M0CFlx3zcmzJwjbwIB4B+2cNeLZpZIFv3kMJsQFFRnXp+b5jhg4U2
          qVmlfG08QWxPwySSENfxACdcDFfdQ2q5/ROjzJ/dacUV8tDBizCWt/+QVEW72Ojq
          S6q5xrqNpk6dUo3EjxYmcwdURP/xPpZ+N5bZ+NBIHB8jAgMBAAE=
          -----END PUBLIC KEY-----
          PUBLIC_KEY
      - name: Collect encrypted recovery point only
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        shell: bash
        run: |
          node --input-type=module <<'SCRIPT'
          // Manual recovery-point collection only. No deployment, writes to D1, or credential export.
          import {randomBytes,publicEncrypt,createCipheriv,createHash,constants} from 'node:crypto';
          import {writeFileSync,readFileSync,mkdirSync} from 'node:fs';
          import {gzipSync} from 'node:zlib';
          
          const account='ac83bd8d9d175c1ac5f1cd6c507d49bd';
          const database='a22d7612-6476-4be9-a7da-557de38f41b6';
          const worker='server-monitor-pro';
          const base=`https://api.cloudflare.com/client/v4/accounts/${account}`;
          const token=process.env.CF_API_TOKEN;
          if(!token || process.env.CF_ACCOUNT_ID!==account || process.env.D1_DATABASE_ID!==database) throw Error('Existing deployment secret identity mismatch');
          const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          async function api(path,body){
            const response=await fetch(base+path,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(90000)});
            const json=await response.json();
            if(!response.ok || json.success===false) throw Error(`Cloudflare request failed: ${path} HTTP ${response.status} codes ${(json.errors||[]).map(e=>e.code).join(',')}`);
            return json.result;
          }
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const items={};
          async function textItem(name,path){
            const response=await fetch(base+path,{headers,signal:AbortSignal.timeout(90000)});
            if(!response.ok) throw Error(`Worker download failed HTTP ${response.status}`);
            const value=Buffer.from(await response.arrayBuffer());
            if(value.length<1000) throw Error('Worker download unexpectedly small');
            items[name]={encoding:'base64',data:value.toString('base64'),content_type:response.headers.get('content-type'),bytes:value.length,sha256:sha(value)};
          }
          await textItem('worker.multipart',`/workers/scripts/${worker}`);
          for(const [name,path] of [
            ['worker-settings.json',`/workers/scripts/${worker}/settings`],
            ['schedules.json',`/workers/scripts/${worker}/schedules`],
            ['deployments.json',`/workers/scripts/${worker}/deployments`],
            ['versions.json',`/workers/scripts/${worker}/versions`]
          ]) items[name]={encoding:'json',data:await api(path)};
          
          const schema=await api(`/d1/database/${database}/query`,{sql:"SELECT type,name,tbl_name,sql FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' ORDER BY type,name"});
          items['schema.json']={encoding:'json',data:schema};
          const config=await api(`/d1/database/${database}/query`,{sql:'SELECT key,value FROM settings ORDER BY key'});
          items['site-settings.json']={encoding:'json',data:config};
          const servers=await api(`/d1/database/${database}/query`,{sql:'SELECT * FROM servers ORDER BY id'});
          items['servers.json']={encoding:'json',data:servers};
          
          let bookmark,exportResult;
          for(let i=0;i<120;i++){
            const result=await api(`/d1/database/${database}/export`,{output_format:'polling',...(bookmark?{current_bookmark:bookmark}:{})});
            if(result.status==='error') throw Error('D1 export reported an error');
            bookmark=result.at_bookmark||bookmark;
            if(result.status==='complete') {exportResult=result;break;}
            await new Promise(resolve=>setTimeout(resolve,3000));
          }
          if(!exportResult?.result?.signed_url) throw Error('D1 export did not complete');
          const sqlResponse=await fetch(exportResult.result.signed_url,{signal:AbortSignal.timeout(180000)});
          if(!sqlResponse.ok) throw Error(`D1 export download HTTP ${sqlResponse.status}`);
          const sql=Buffer.from(await sqlResponse.arrayBuffer());
          if(sql.length<1000 || !sql.toString('utf8',0,4096).includes('CREATE TABLE')) throw Error('D1 export is not a SQL database backup');
          items['database.sql']={encoding:'base64',data:sql.toString('base64'),bytes:sql.length,sha256:sha(sql)};
          const manifest={format:1,account,database,worker,at:new Date().toISOString(),bookmark,items};
          const plain=gzipSync(Buffer.from(JSON.stringify(manifest)));
          const key=randomBytes(32),iv=randomBytes(12),aad=Buffer.from('CFSM-RECOVERY-20261027-v1');
          const cipher=createCipheriv('aes-256-gcm',key,iv);cipher.setAAD(aad);
          const ciphertext=Buffer.concat([cipher.update(plain),cipher.final()]);
          const wrapped=publicEncrypt({key:readFileSync('backup-public-key.pem'),oaepHash:'sha256',padding:constants.RSA_PKCS1_OAEP_PADDING},key);
          mkdirSync('recovery-artifact',{recursive:true});
          writeFileSync('recovery-artifact/recovery.enc.json',JSON.stringify({format:1,cipher:'AES-256-GCM',key_wrap:'RSA-OAEP-SHA256',aad:aad.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),wrapped_key:wrapped.toString('base64'),ciphertext:ciphertext.toString('base64')}));
          const summary={complete:true,at:manifest.at,database_sql_bytes:sql.length,worker_bytes:items['worker.multipart'].bytes,item_count:Object.keys(items).length,encrypted_only:true,plaintext_logged:false,plaintext_artifact:false};
          writeFileSync('recovery-artifact/summary.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary));
          SCRIPT
      - name: Retain encrypted recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfsm-recovery-20261027
          path: recovery-artifact/
          retention-days: 7
          if-no-files-found: error
