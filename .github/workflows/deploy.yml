name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - id: decide
        run: |
          if [ -n "$CF_ACCOUNT_ID" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Cron, history and agent compatibility
        run: |
          node --test test/cron-notification.test.js test/latest-timestamps.test.js test/latest-metrics-all.test.js test/metrics-broadcaster-agent-config.test.js test/history-query.test.js
          npm run test:agent-config

      - name: 🏗️ Build frontend assets
        run: npm run build:frontend

      - name: 📝 Create wrangler.toml
        run: |
          cat > wrangler.toml << 'WEOF'
          name = "server-monitor-pro"
          main = "src/index.js"
          compatibility_date = "2024-12-01"
          compatibility_flags = ["nodejs_compat"]
          keep_vars = true

          # 定时任务配置（UTC）
          # - 每分钟：执行离线节点检测
          # - 每小时：合并执行其他定时任务（每月1号数据清理、每月8号清理旧表、每天12点服务器到期检测）
          [triggers]
          crons = ["*/1 * * * *", "0 * * * *"]

          [assets]
          directory = "./dist"
          binding = "ASSETS"

          [[d1_databases]]
          binding = "DB"
          database_name = "server-monitor-db"
          database_id = "D1_PLACEHOLDER"

          # Durable Objects：实时指标广播中心
          [[durable_objects.bindings]]
          name = "METRICS_BROADCASTER"
          class_name = "MetricsBroadcaster"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["MetricsBroadcaster"]

          WEOF

          # 替换占位符
          sed -i "s|D1_PLACEHOLDER|${{ secrets.D1_DATABASE_ID }}|g" wrangler.toml

          echo "✅ wrangler.toml 已生成"

      # wrangler v4 的 `deploy` 会自动根据 wrangler.toml 中的 [[durable_objects.bindings]]
      # 声明创建 DO namespace（幂等：已存在则跳过），无需单独命令。
      # 前提：MetricsBroadcaster 类必须从 index.js 导出（已通过 src/index.js 实现）。
      - name: Add only the two compatible nullable server fields
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        shell: bash
        run: |
          node --input-type=module <<'MIGRATE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          assert.equal(process.env.CF_ACCOUNT_ID,'ac83bd8d9d175c1ac5f1cd6c507d49bd');
          assert.equal(process.env.D1_DATABASE_ID,'a22d7612-6476-4be9-a7da-557de38f41b6');
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT_ID+'/d1/database/'+process.env.D1_DATABASE_ID+'/query';
          async function query(sql){
            const response=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+process.env.CF_API_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql}),signal:AbortSignal.timeout(60000)});
            const result=await response.json();
            if(!response.ok || !result.success || !result.result?.[0]?.success) throw Error('D1 compatibility query failed, HTTP '+response.status);
            return result.result[0].results;
          }
          const hash=value=>createHash('sha256').update(JSON.stringify(value)).digest('hex');
          const before=await query('SELECT * FROM servers ORDER BY id');
          const beforeSettings=await query('SELECT key,value FROM settings ORDER BY key');
          const columns=await query('PRAGMA table_info(servers)');
          const originalNames=columns.map(c=>c.name);
          const project=rows=>rows.map(row=>Object.fromEntries(originalNames.map(name=>[name,row[name]])));
          const added=[];
          for(const [name,definition] of [['traffic_alert_percent','INTEGER DEFAULT NULL'],['traffic_alert_state','TEXT']]){
            if(!originalNames.includes(name)){await query('ALTER TABLE servers ADD COLUMN '+name+' '+definition);added.push(name);}
          }
          const after=await query('SELECT * FROM servers ORDER BY id');
          const afterSettings=await query('SELECT key,value FROM settings ORDER BY key');
          assert.equal(hash(project(before)),hash(project(after)),'Existing server data changed');
          assert.equal(hash(beforeSettings),hash(afterSettings),'Existing settings changed');
          console.log(JSON.stringify({compatible:true,added,servers:after.length,existing_data_unchanged:true,settings_unchanged:true}));
          MIGRATE

      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4.120.0'
          command: deploy

      - name: ✅ Deployment Success
        if: success()
        run: |
          echo "============================================"
          echo "  🎉 部署成功！"
          echo "============================================"

      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "============================================"
          echo "  💥 部署失败！请检查 Actions 日志"
          echo "============================================"
